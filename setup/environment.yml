name: audio_gpu
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  # --- Python ---
  - python=3.10

  # --- PyTorch (GPU con CUDA 12.1 - requiere tarjeta NVIDIA compatible) ---
  # Para CPU (máquinas sin GPU), sustituir las 4 líneas siguientes por:
  #   - pytorch=2.5.1
  #   - torchaudio=2.5.1
  #   - torchvision=0.20.1
  #   - cpuonly
  - pytorch=2.5.1
  - torchaudio=2.5.1
  - torchvision=0.20.1
  - pytorch-cuda=12.1

  # --- Audio ---
  - ffmpeg>=6.0
  - librosa=0.11.0
  - numba=0.62.1

  # --- Numérica y ciencia de datos ---
  - numpy=2.2.6
  - scipy=1.15.2
  - scikit-learn=1.7.2

  # --- Visualización ---
  - matplotlib=3.10.8

  # --- GUI ---
  - tk=8.6.13

  # --- Pip ---
  - pip
  - pip:
    - soundfile==0.13.1
    - sounddevice==0.5.3
    - pandas==2.3.3
    - openpyxl==3.1.5
